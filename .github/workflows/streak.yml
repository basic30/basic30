name: Update GitHub Streak

on:
  schedule:
    # Every day at 00:15 UTC
    - cron: "15 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate-streak:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: basic30
        run: |
          node scripts/generate-streak.js

      - name: Commit SVG
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add streak.svg

          if git diff --cached --quiet; then
            echo "No changes to streak.svg"
          else
            git commit -m "Update GitHub streak"
            git push
          fi
